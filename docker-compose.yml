services:
  sga-db:
    image: postgres:16-alpine
    container_name: sga-db
    environment:
      POSTGRES_USER: sgauser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sgapassword123!}
      POSTGRES_DB: sgadb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sga-network
    restart: unless-stopped
    ports:
      - "5432:5432"

  sga-backend:
    build:
      context: ./backend
    container_name: sga-backend
    depends_on:
      - sga-db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://sga-db:5432/sgadb
      - SPRING_DATASOURCE_USERNAME=sgauser
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-sgapassword123!}
      - SPRING_DATASOURCE_DRIVER=org.postgresql.Driver
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    networks:
      - sga-network
    restart: unless-stopped

  sga-frontend:
    build:
      context: ./frontend
    container_name: sga-frontend
    depends_on:
      - sga-backend
    ports:
      - "80:80"
    networks:
      - sga-network
    restart: unless-stopped

networks:
  sga-network:
    driver: bridge

volumes:
  postgres_data:
