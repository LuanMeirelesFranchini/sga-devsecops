<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA - Painel do Atendente / Guichê</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
        }

        .dashboard {
            max-width: 900px;
            width: 100%;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #334155;
        }

        .guiche-selector {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .guiche-selector label { font-weight: 600; color: #94a3b8; }
        .guiche-selector input {
            background: #0f172a;
            border: 1px solid #38bdf8;
            color: #fff;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 1.1rem;
            width: 140px;
        }

        /* Metrics */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid #334155;
        }

        .metric-card h3 { font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; }
        .metric-card .value { font-size: 2.2rem; font-weight: 700; color: #38bdf8; }

        /* Current Call Section */
        .current-section {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid #38bdf8;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
        }

        .current-section h2 { font-size: 1.1rem; color: #94a3b8; text-transform: uppercase; }
        .current-code { font-size: 5rem; font-weight: 900; color: #fff; margin: 10px 0; }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3); }

        .btn-call { background: #38bdf8; color: #0f172a; font-size: 1.3rem; }
        .btn-recall { background: #f59e0b; color: #0f172a; }
        .btn-finish { background: #10b981; color: #fff; }

        .back-link {
            display: inline-block;
            color: #94a3b8;
            text-decoration: none;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <a href="index.html" class="back-link">← Voltar ao Início</a>

        <div class="top-bar">
            <h2>PAINEL DO ATENDENTE</h2>
            <div class="guiche-selector">
                <label for="guicheInput">Guichê Atual:</label>
                <input type="text" id="guicheInput" value="Guichê 01">
            </div>
        </div>

        <div class="metrics-grid">
            <div class="metric-card">
                <h3>Total Fila</h3>
                <div class="value" id="mTotal">0</div>
            </div>
            <div class="metric-card">
                <h3>Preferencial</h3>
                <div class="value" style="color: #f59e0b;" id="mPref">0</div>
            </div>
            <div class="metric-card">
                <h3>Normal</h3>
                <div class="value" style="color: #38bdf8;" id="mNorm">0</div>
            </div>
            <div class="metric-card">
                <h3>Exames</h3>
                <div class="value" style="color: #10b981;" id="mExam">0</div>
            </div>
        </div>

        <div class="current-section">
            <h2>Em Atendimento no Seu Guichê</h2>
            <div class="current-code" id="currentCode">---</div>
            <div id="currentType" style="color: #94a3b8; font-weight: 600;">Nenhuma senha chamada no momento</div>

            <div class="action-buttons">
                <button class="btn btn-call" onclick="chamarProxima()">🔔 Chamar Próxima Senha</button>
                <button class="btn btn-recall" id="btnRecall" onclick="rechamar()" disabled>🔁 Rechamar</button>
                <button class="btn btn-finish" id="btnFinish" onclick="concluir()" disabled>✅ Concluir Atendimento</button>
            </div>
        </div>
    </div>

    <script>
        let senhaAtualObj = null;

        async function carregarEstatisticas() {
            try {
                const res = await fetch('/api/senhas/estatisticas');
                if (!res.ok) return;
                const data = await res.json();

                document.getElementById('mTotal').innerText = data.totalAguardando;
                document.getElementById('mPref').innerText = data.preferencialAguardando;
                document.getElementById('mNorm').innerText = data.normalAguardando;
                document.getElementById('mExam').innerText = data.examesAguardando;
            } catch (err) {
                console.error(err);
            }
        }

        async function chamarProxima() {
            const guiche = document.getElementById('guicheInput').value;
            try {
                const res = await fetch('/api/atendimento/chamar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ guiche: guiche, tipoFila: null })
                });

                if (res.status === 204) {
                    alert('Não há senhas aguardando na fila!');
                    return;
                }

                if (!res.ok) {
                    throw new Error('Erro ao chamar próxima senha.');
                }

                senhaAtualObj = await res.json();
                atualizarInterfaceAtual();
                carregarEstatisticas();
            } catch (err) {
                alert(err.message);
            }
        }

        async function rechamar() {
            if (!senhaAtualObj) return;
            try {
                const res = await fetch(`/api/atendimento/${senhaAtualObj.id}/rechamar`, { method: 'POST' });
                if (res.ok) {
                    alert(`Senha ${senhaAtualObj.codigo} rechamada com sucesso no painel!`);
                }
            } catch (err) {
                alert(err.message);
            }
        }

        async function concluir() {
            if (!senhaAtualObj) return;
            try {
                const res = await fetch(`/api/atendimento/${senhaAtualObj.id}/concluir`, { method: 'POST' });
                if (res.ok) {
                    senhaAtualObj = null;
                    atualizarInterfaceAtual();
                    carregarEstatisticas();
                }
            } catch (err) {
                alert(err.message);
            }
        }

        function atualizarInterfaceAtual() {
            if (senhaAtualObj) {
                document.getElementById('currentCode').innerText = senhaAtualObj.codigo;
                document.getElementById('currentType').innerText = `TIPO: ${senhaAtualObj.tipo}`;
                document.getElementById('btnRecall').disabled = false;
                document.getElementById('btnFinish').disabled = false;
            } else {
                document.getElementById('currentCode').innerText = '---';
                document.getElementById('currentType').innerText = 'Nenhuma senha chamada no momento';
                document.getElementById('btnRecall').disabled = true;
                document.getElementById('btnFinish').disabled = true;
            }
        }

        setInterval(carregarEstatisticas, 3000);
        carregarEstatisticas();
    </script>
</body>
</html>
