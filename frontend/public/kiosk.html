<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA - Totem Colégio La Salle</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1e293b, #0f172a);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 5px;
            color: #38bdf8;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 1.3rem;
            margin-bottom: 50px;
        }

        /* Telas (Passo 1 e Passo 2) */
        #telaSetores, #telaPrioridades {
            transition: opacity 0.3s ease;
        }
        
        #telaPrioridades {
            display: none;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .btn-tipo {
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 20px;
            color: #fff;
            font-size: 1.4rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .btn-tipo:hover {
            transform: translateY(-5px);
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
            box-shadow: 0 15px 40px rgba(56, 189, 248, 0.3);
        }

        /* Cores Específicas */
        .btn-tipo.rec { border-color: #38bdf8; }
        .btn-tipo.rec:hover { background: rgba(56, 189, 248, 0.2); }

        .btn-tipo.sto { border-color: #ec4899; }
        .btn-tipo.sto:hover { background: rgba(236, 72, 153, 0.2); }

        .btn-tipo.prioridade { border-color: #f59e0b; }
        .btn-tipo.prioridade:hover { background: rgba(245, 158, 11, 0.2); }

        .btn-tipo.normal { border-color: #10b981; }
        .btn-tipo.normal:hover { background: rgba(16, 185, 129, 0.2); }

        .icon { font-size: 4rem; margin-bottom: 10px; }

        .btn-voltar {
            background: transparent;
            border: 2px solid #64748b;
            color: #cbd5e1;
            padding: 12px 30px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .btn-voltar:hover {
            background: rgba(100, 116, 139, 0.2);
            color: #fff;
            border-color: #94a3b8;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .ticket {
            background: #ffffff;
            color: #0f172a;
            padding: 40px;
            border-radius: 20px;
            width: 360px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.6); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .ticket h2 { font-size: 1.3rem; color: #64748b; text-transform: uppercase; letter-spacing: 1.5px; }
        .ticket .code { font-size: 4rem; font-weight: 900; color: #0284c7; margin: 20px 0; }
        .ticket .type-name { font-weight: 700; font-size: 1.1rem; color: #334155; margin-bottom: 25px; }
        .ticket .date { font-size: 0.9rem; color: #94a3b8; }

        .back-link {
            position: absolute;
            top: 30px;
            left: 30px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
        }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">← Sair do Totem</a>

    <div class="container">
        <h1>Colégio La Salle</h1>
        
        <!-- PASSO 1: Escolha do Setor -->
        <div id="telaSetores">
            <p class="subtitle">Selecione o setor de atendimento desejado</p>
            <div class="buttons-grid">
                <button class="btn-tipo rec" onclick="selecionarSetor('RECEPCAO', 'Recepção')">
                    <span class="icon">🏫</span>
                    <span>Recepção Geral</span>
                    <small style="font-size: 0.9rem; font-weight: 300; opacity: 0.8">Secretaria, Matrículas, Financeiro</small>
                </button>

                <button class="btn-tipo sto" onclick="selecionarSetor('STORE', 'La Salle Store')">
                    <span class="icon">👕</span>
                    <span>La Salle Store</span>
                    <small style="font-size: 0.9rem; font-weight: 300; opacity: 0.8">Uniformes & Materiais</small>
                </button>

                <button class="btn-tipo" style="border-color: #8b5cf6;" onclick="gerarSenhaDireta('DIRECAO_AGENDADO')" onmouseover="this.style.background='rgba(139, 92, 246, 0.2)'" onmouseout="this.style.background='rgba(30, 41, 59, 0.8)'">
                    <span class="icon">📅</span>
                    <span>Agendamentos</span>
                    <small style="font-size: 0.9rem; font-weight: 300; opacity: 0.8">Direção & Coordenação</small>
                </button>
            </div>
        </div>

        <!-- PASSO 2: Escolha da Prioridade -->
        <div id="telaPrioridades">
            <p class="subtitle">Setor: <strong id="lblSetorSelecionado" style="color: #38bdf8;">--</strong><br>Agora, selecione o tipo de fila</p>
            <div class="buttons-grid">
                <button class="btn-tipo normal" onclick="confirmarPrioridade('NORMAL')">
                    <span class="icon">🚶‍♂️</span>
                    <span>Atendimento Normal</span>
                    <small style="font-size: 0.9rem; font-weight: 300; opacity: 0.8">Fila Convencional</small>
                </button>

                <button class="btn-tipo prioridade" onclick="confirmarPrioridade('PREFERENCIAL')">
                    <span class="icon">⭐</span>
                    <span>Atendimento Prioritário</span>
                    <small style="font-size: 0.9rem; font-weight: 300; opacity: 0.8">Idosos, Gestantes, PCD, Bebês de Colo</small>
                </button>
            </div>
            
            <button class="btn-voltar" onclick="voltarParaSetores()">
                ↩ Voltar para escolha de setor
            </button>
        </div>
    </div>

    <!-- Modal do Ticket -->
    <div class="modal-overlay" id="modalTicket">
        <div class="ticket">
            <h2>COLÉGIO LA SALLE</h2>
            <div class="code" id="ticketCodigo">REC-001</div>
            <div class="type-name" id="ticketTipo">RECEPÇÃO GERAL</div>
            <div class="date" id="ticketData">04/08/2026 17:25</div>
            <p style="margin-top: 20px; font-size: 0.85rem; color: #64748b; font-weight: 600;">Por favor, retire sua senha e aguarde a chamada no painel.</p>
        </div>
    </div>

    <script>
        let setorAtual = ''; // 'RECEPCAO' ou 'STORE'

        function selecionarSetor(setorKey, setorNome) {
            setorAtual = setorKey;
            document.getElementById('lblSetorSelecionado').innerText = setorNome;
            document.getElementById('telaSetores').style.display = 'none';
            document.getElementById('telaPrioridades').style.display = 'block';
        }

        function voltarParaSetores() {
            setorAtual = '';
            document.getElementById('telaPrioridades').style.display = 'none';
            document.getElementById('telaSetores').style.display = 'block';
        }

        async function confirmarPrioridade(prioridadeStr) {
            // Monta a string do Enum TipoAtendimento: ex "RECEPCAO_NORMAL" ou "STORE_PREFERENCIAL"
            const tipoFinal = `${setorAtual}_${prioridadeStr}`;
            
            try {
                const response = await fetch('/api/senhas/gerar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tipo: tipoFinal })
                });

                if (!response.ok) {
                    throw new Error('Falha ao gerar senha no servidor.');
                }

                const senha = await response.json();

                document.getElementById('ticketCodigo').innerText = senha.codigo;
                document.getElementById('ticketTipo').innerText = senha.tipo.replace('_', ' ');
                document.getElementById('ticketData').innerText = new Date(senha.dataCriacao).toLocaleString('pt-BR');

                const modal = document.getElementById('modalTicket');
                modal.style.display = 'flex';

                // Volta para a tela inicial por trás do modal para estar pronto para a próxima pessoa
                voltarParaSetores();

                setTimeout(() => {
                    modal.style.display = 'none';
                }, 4000);

            } catch (err) {
                alert('Erro de Conexão: ' + err.message);
                voltarParaSetores();
            }
        }

        async function gerarSenhaDireta(tipoFinal) {
            try {
                const response = await fetch('/api/senhas/gerar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tipo: tipoFinal })
                });

                if (!response.ok) {
                    throw new Error('Falha ao gerar senha no servidor.');
                }

                const senha = await response.json();

                document.getElementById('ticketCodigo').innerText = senha.codigo;
                document.getElementById('ticketTipo').innerText = senha.tipo.replace('_', ' ');
                document.getElementById('ticketData').innerText = new Date(senha.dataCriacao).toLocaleString('pt-BR');

                const modal = document.getElementById('modalTicket');
                modal.style.display = 'flex';

                setTimeout(() => {
                    modal.style.display = 'none';
                }, 4000);

            } catch (err) {
                alert('Erro de Conexão: ' + err.message);
            }
        }
    </script>
</body>
</html>
