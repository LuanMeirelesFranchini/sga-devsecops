<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA - Painel TV Colégio La Salle</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: #090d16;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: #1e293b;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #334155;
        }

        header h1 {
            font-size: 1.8rem;
            color: #38bdf8;
            letter-spacing: 1px;
        }

        .clock {
            font-size: 1.5rem;
            font-weight: 600;
            color: #94a3b8;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            flex: 1;
            gap: 20px;
            padding: 20px;
        }

        /* Card Destaque da Senha Atual */
        .call-banner {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            border: 3px solid #38bdf8;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 50px rgba(56, 189, 248, 0.25);
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            from { box-shadow: 0 0 30px rgba(56, 189, 248, 0.2); }
            to { box-shadow: 0 0 60px rgba(56, 189, 248, 0.5); }
        }

        .call-banner .label {
            font-size: 2rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .call-banner .code-display {
            font-size: 9rem;
            font-weight: 900;
            color: #f8fafc;
            margin: 10px 0;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .call-banner .guiche-display {
            font-size: 3.5rem;
            font-weight: 700;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            padding: 10px 40px;
            border-radius: 50px;
            border: 1px solid rgba(56, 189, 248, 0.4);
        }

        .history-panel {
            background: #141c2e;
            border-radius: 20px;
            border: 1px solid #1e293b;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .history-panel h2 {
            font-size: 1.4rem;
            color: #94a3b8;
            margin-bottom: 15px;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }

        .history-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        .history-item {
            background: #1e293b;
            padding: 15px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid #64748b;
        }

        .history-item.rec-p { border-left-color: #f59e0b; }
        .history-item.rec { border-left-color: #38bdf8; }
        .history-item.sto-p { border-left-color: #a855f7; }
        .history-item.sto { border-left-color: #ec4899; }

        .history-code { font-size: 1.5rem; font-weight: 700; }
        .history-guiche { font-size: 1.2rem; color: #94a3b8; }
    </style>
</head>
<body>

    <header>
        <h1>COLÉGIO LA SALLE - PAINEL DE ATENDIMENTO</h1>
        <div class="clock" id="relogio">00:00:00</div>
    </header>

    <div class="main-layout">
        <div class="call-banner">
            <div class="label">SENHA CHAMADA</div>
            <div class="code-display" id="mainCode">---</div>
            <div class="guiche-display" id="mainGuiche">Aguardando...</div>
        </div>

        <div class="history-panel">
            <h2>Últimas Chamadas</h2>
            <ul class="history-list" id="historyList">
                <li style="color: #64748b; text-align: center; padding: 20px;">Nenhuma senha chamada ainda.</li>
            </ul>
        </div>
    </div>

    <script>
        let ultimaSenhaId = null;
        let isPrimeiroLoad = true;

        setInterval(() => {
            const agora = new Date();
            const dataStr = agora.toLocaleDateString('pt-BR');
            const horaStr = agora.toLocaleTimeString('pt-BR');
            document.getElementById('relogio').innerText = `${dataStr}  |  ${horaStr}`;
        }, 1000);

        function anunciarSenha(codigo, guiche) {
            if ('speechSynthesis' in window) {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = 587.33;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);

                setTimeout(() => {
                    const msg = new SpeechSynthesisUtterance(`Senha ${codigo.replace('-', ' ')}, comparecer ao ${guiche}`);
                    msg.lang = 'pt-BR';
                    msg.rate = 0.9;
                    window.speechSynthesis.speak(msg);
                }, 400);
            }
        }

        async function atualizarPainel() {
            try {
                const res = await fetch('/api/senhas/painel');
                if (!res.ok) return;
                const senhas = await res.json();

                if (senhas && senhas.length > 0) {
                    const atual = senhas[0];

                    document.getElementById('mainCode').innerText = atual.codigo;
                    document.getElementById('mainGuiche').innerText = atual.guiche || 'Guichê --';

                    if (ultimaSenhaId !== atual.id + '_' + atual.dataChamada) {
                        ultimaSenhaId = atual.id + '_' + atual.dataChamada;
                        if (!isPrimeiroLoad) {
                            anunciarSenha(atual.codigo, atual.guiche);
                        }
                    }
                    
                    isPrimeiroLoad = false;

                    const historyList = document.getElementById('historyList');
                    historyList.innerHTML = '';

                    senhas.slice(1).forEach(item => {
                        const li = document.createElement('li');
                        let classeTipo = 'rec';
                        if (item.tipo === 'RECEPCAO_PREFERENCIAL') classeTipo = 'rec-p';
                        else if (item.tipo === 'STORE_PREFERENCIAL') classeTipo = 'sto-p';
                        else if (item.tipo === 'STORE_NORMAL') classeTipo = 'sto';

                        li.className = `history-item ${classeTipo}`;
                        li.innerHTML = `
                            <span class="history-code">${item.codigo}</span>
                            <span class="history-guiche">${item.guiche || ''}</span>
                        `;
                        historyList.appendChild(li);
                    });
                }
            } catch (err) {
                console.error('Erro ao consultar painel:', err);
            }
        }

        setInterval(atualizarPainel, 3000);
        atualizarPainel();
    </script>
</body>
</html>
