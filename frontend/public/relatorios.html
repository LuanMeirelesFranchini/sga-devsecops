<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA - Relatórios de Desempenho</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .dashboard {
            max-width: 1000px;
            width: 100%;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: #1e293b;
            padding: 20px 30px;
            border-radius: 16px;
            border: 1px solid #334155;
        }

        .header-bar h2 { font-size: 1.6rem; color: #8b5cf6; }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 25px;
            text-align: center;
        }

        .metric-card h3 { font-size: 1rem; color: #94a3b8; margin-bottom: 15px; }
        .metric-card .value { font-size: 2.5rem; font-weight: 700; color: #38bdf8; }
        .metric-card.tme .value { color: #f59e0b; }
        .metric-card.tma .value { color: #10b981; }

        .card-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 25px;
        }

        .card-box h3 { font-size: 1.3rem; margin-bottom: 20px; color: #f8fafc; }

        .table-history {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .table-history th, .table-history td {
            padding: 14px;
            border-bottom: 1px solid #334155;
        }

        .table-history th { color: #94a3b8; font-weight: 600; text-transform: uppercase; font-size: 0.85rem; }
        
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid #10b981;
        }

        .back-link { display: inline-block; color: #94a3b8; text-decoration: none; margin-bottom: 20px; }
        
        .btn-danger {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <a href="javascript:history.back()" class="back-link">← Voltar</a>

        <div class="header-bar">
            <h2>📈 Dashboard de Desempenho (SGA)</h2>
            <button class="btn-danger" onclick="realizarLogout()">Encerrar Sessão</button>
        </div>

        <div class="metrics-grid">
            <div class="metric-card">
                <h3>Total de Atendimentos</h3>
                <div class="value" id="lblTotal">0</div>
            </div>
            <div class="metric-card tme">
                <h3>TME (Tempo Médio Espera)</h3>
                <div class="value" id="lblTME">00:00:00</div>
            </div>
            <div class="metric-card tma">
                <h3>TMA (Tempo Médio Atendimento)</h3>
                <div class="value" id="lblTMA">00:00:00</div>
            </div>
        </div>

        <div class="card-box">
            <h3>📝 Histórico de Atendimentos Concluídos (Últimos 10)</h3>
            <table class="table-history">
                <thead>
                    <tr>
                        <th>Senha</th>
                        <th>Setor/Tipo</th>
                        <th>Guichê</th>
                        <th>Início</th>
                        <th>Fim</th>
                        <th>Status</th>
                        <th>Observação</th>
                    </tr>
                </thead>
                <tbody id="tbodyHistorico">
                    <tr><td colspan="7" style="text-align:center; color:#94a3b8;">Carregando dados...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const token = sessionStorage.getItem('sga_admin_token') || sessionStorage.getItem('sga_token');

        if (!token) {
            alert('Acesso negado. Faça login primeiro.');
            window.location.href = 'index.html';
        }

        async function carregarRelatorios() {
            try {
                // 1. Carregar Estatísticas Diárias
                const resEst = await fetch('/api/relatorios/diario', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (resEst.status === 403 || resEst.status === 401) {
                    alert('Você não tem permissão para acessar os relatórios.');
                    realizarLogout();
                    return;
                }

                if (resEst.ok) {
                    const estatisticas = await resEst.json();
                    document.getElementById('lblTotal').innerText = estatisticas.totalAtendimentos;
                    document.getElementById('lblTME').innerText = estatisticas.tempoMedioEspera;
                    document.getElementById('lblTMA').innerText = estatisticas.tempoMedioAtendimento;
                }

                // 2. Carregar Histórico
                const resHist = await fetch('/api/relatorios/historico', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (resHist.ok) {
                    const historico = await resHist.json();
                    const tbody = document.getElementById('tbodyHistorico');
                    tbody.innerHTML = '';

                    if (historico.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#94a3b8;">Nenhum atendimento concluído ainda.</td></tr>';
                    }

                    historico.forEach(h => {
                        const tr = document.createElement('tr');
                        const dataChamada = new Date(h.dataChamada).toLocaleTimeString('pt-BR');
                        const dataFim = new Date(h.dataAtendimento).toLocaleTimeString('pt-BR');
                        
                        tr.innerHTML = `
                            <td><strong>${h.codigo}</strong></td>
                            <td>${h.tipo.replace('_', ' ')}</td>
                            <td>${h.guiche || '-'}</td>
                            <td>${dataChamada}</td>
                            <td>${dataFim}</td>
                            <td><span class="badge">CONCLUÍDO</span></td>
                            <td style="max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${h.observacao || ''}">${h.observacao || '-'}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (err) {
                console.error(err);
            }
        }

        function realizarLogout() {
            sessionStorage.removeItem('sga_admin_token');
            sessionStorage.removeItem('sga_token');
            window.location.href = 'index.html';
        }

        carregarRelatorios();
    </script>
</body>
</html>
